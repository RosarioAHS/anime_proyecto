security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuarios
                property: correoElectronico

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: peliculas_index
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Rutas públicas
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/registro, roles: PUBLIC_ACCESS }
        - { path: ^/peliculas$, roles: PUBLIC_ACCESS }
        - { path: ^/peliculas/\d+$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/estadisticas, roles: ROLE_USER }

        # Rutas que requieren autenticación
        - { path: ^/valoraciones, roles: ROLE_USER }
        - { path: ^/rankings, roles: ROLE_USER }
        - { path: ^/perfil, roles: ROLE_USER }

        # Rutas solo para administradores
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
